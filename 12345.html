      radial-gradient(120% 90% at 50% -10%, var(--bg-3) 0%, var(--bg-2) 46%, var(--bg-1) 100%);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    line-height:1.7;
  }
  ::selection{background:#f6c86944}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

  /* ===== 背景星星 ===== */
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .star{
    position:absolute;border-radius:50%;
    background:#fff;opacity:0;
    animation:twinkle 3.6s ease-in-out infinite;
  }
  .stars.lit .star{animation-duration:1.9s}
  @keyframes twinkle{
    0%,100%{opacity:0}
    40%{opacity:.85}
    60%{opacity:.5}
  }

  /* ===== 布局 ===== */
  .page{
    position:relative;z-index:1;
    max-width:470px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 34px);
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-size:13px;letter-spacing:.35em;color:var(--gold-soft);
    font-weight:500;opacity:.92;padding-left:.35em;
  }
  .title{
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    font-size:clamp(40px,11vw,52px);font-weight:900;
    margin:10px 0 4px;letter-spacing:.06em;
    background:linear-gradient(180deg,#fff6dd 0%,var(--gold) 55%,#e9a94f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .for-name{
    font-size:15px;color:var(--pink);font-weight:500;
    margin-bottom:26px;
  }
  .for-name b{color:var(--gold-soft);font-weight:700}

  /* ===== 蛋糕区 ===== */
  .stage{
    position:relative;width:min(88%,300px);margin:0 auto;
    border-radius:24px;
  }
  .cake-wrap{
    position:relative;border-radius:24px;overflow:hidden;
    box-shadow:0 24px 60px -22px #000000b3, 0 0 0 1px var(--line);
    transition:filter 1.2s ease, transform 1.2s ease;
    filter:brightness(.68) saturate(.85);
    transform:scale(.97);
  }
  .cake-wrap.lit{
    filter:brightness(1.04) saturate(1.05);
    transform:scale(1);
  }
  .cake-wrap img{
    display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;
  }
  /* 烛光光晕 */
  .glow{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(55% 42% at 50% 24%, rgba(255,214,128,.55), transparent 70%),
      radial-gradient(85% 65% at 50% 62%, rgba(255,157,184,.20), transparent 75%);
    opacity:0;transition:opacity 1.6s ease;
    mix-blend-mode:screen;border-radius:24px;
  }
  .stage.lit .glow{opacity:1}
  /* 烛焰动画叠加 */
  .flame{
    position:absolute;left:50%;top:17%;width:26px;height:34px;
    transform:translate(-50%,-50%);
    opacity:0;transition:opacity 1s ease;pointer-events:none;
    filter:blur(1px);
  }
  .stage.lit .flame{opacity:1}
  .flame i{
    position:absolute;left:50%;bottom:0;width:18px;height:30px;
    transform:translateX(-50%);
    background:radial-gradient(60% 70% at 50% 82%, #fff6d8 0%, #ffd98f 42%, #ff9a4d 74%, transparent 100%);
    border-radius:50% 50% 46% 46%;
    transform-origin:50% 100%;
    animation:flick 1.6s ease-in-out infinite;
  }
  .flame i::after{
    content:"";position:absolute;left:50%;bottom:2px;width:10px;height:16px;
    transform:translateX(-50%);
    background:radial-gradient(60% 70% at 50% 80%, #fffdf2 0%, #ffe9ad 55%, transparent 100%);
    border-radius:50% 50% 46% 46%;
  }
  @keyframes flick{
    0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg)}
    30%{transform:translateX(-50%) scale(1.06,.94) rotate(2.5deg)}
    60%{transform:translateX(-50%) scale(.96,1.05) rotate(-1.5deg)}
  }

  /* ===== 祝福语 ===== */
  .wish{
    margin:30px 6px 0;font-size:16px;color:#e9edfb;
    font-weight:300;letter-spacing:.02em;max-width:400px;
  }
  .wish em{font-style:normal;color:var(--gold-soft)}

  /* ===== 交互按钮 ===== */
  .actions{
    margin-top:32px;width:100%;
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;
  }
  .act{
    appearance:none;border:none;cursor:pointer;
    background:var(--card);border:1px solid var(--line);
    border-radius:18px;color:var(--ink);
    padding:18px 6px 14px;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    font-family:inherit;font-size:14px;font-weight:500;line-height:1.35;
    transition:transform .18s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease;
  }
  .act svg{width:26px;height:26px;display:block}
  .act:hover{background:#ffffff14;border-color:#ffffff33}
  .act:active{transform:scale(.94)}
  .act:disabled{opacity:.55;cursor:default;transform:none}

  /* ===== 音乐开关 ===== */
  .mute{
    position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:14px;z-index:60;
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:#ffffff10;
    color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transform:translateY(-6px);
    transition:opacity .5s ease, transform .5s ease, background .25s ease;
  }
  .mute.show{opacity:1;pointer-events:auto;transform:none}
  .mute:hover{background:#ffffff1c}
  .mute svg{width:20px;height:20px}
  .mute .icon-off{display:none}
  .mute.off .icon-on{display:none}
  .mute.off .icon-off{display:block}

  /* ===== Toast ===== */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);
    transform:translateX(-50%) translateY(16px);
    background:#0e1730ee;border:1px solid var(--line);
    color:var(--gold-soft);padding:10px 20px;border-radius:999px;
    font-size:14px;z-index:80;opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    box-shadow:0 10px 30px -10px #00000099;
    max-width:86%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 礼物模态 ===== */
  .modal{
    position:fixed;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;padding:26px;
    background:#060b1a99;backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  .modal.show{opacity:1;pointer-events:auto}
  .gift-card{
    position:relative;width:100%;max-width:380px;
    background:linear-gradient(170deg,#2a3a72 0%,#1b2852 60%,#141e3f 100%);
    border:1px solid #ffffff2b;border-radius:26px;
    padding:34px 26px 26px;text-align:center;
    box-shadow:0 40px 90px -30px #000000d9;
    transform:translateY(30px) scale(.92);opacity:0;
    transition:transform .55s cubic-bezier(.22,1,.36,1), opacity .4s ease;
  }
  .modal.show .gift-card{transform:none;opacity:1}
  .gift-card .ribbon{
    position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    width:120px;height:34px;
    background:linear-gradient(90deg,#ffb1c4,#ff9db8,#ffb1c4);
    clip-path:polygon(0 0,100% 0,92% 100%,50% 78%,8% 100%);
    display:flex;align-items:center;justify-content:center;
    color:#3b0f22;font-size:12px;font-weight:700;letter-spacing:.18em;padding-left:.18em;
  }
  .gift-card h3{
    font-family:"Noto Serif SC",serif;font-size:24px;font-weight:900;
    margin:30px 0 14px;color:var(--gold-soft);
  }
  .gift-card p{font-size:15px;color:#e6eafc;font-weight:300;line-height:2}
  .gift-card .close{
    margin-top:24px;appearance:none;border:none;cursor:pointer;
    background:var(--gold);color:#3a2500;font-family:inherit;
    font-size:14.5px;font-weight:700;padding:11px 30px;border-radius:999px;
    transition:transform .18s ease, background .25s ease;
  }
  .gift-card .close:hover{background:var(--gold-soft)}
  .gift-card .close:active{transform:scale(.95)}

  /* ===== 烟花画布 ===== */
  #fireworks{
    position:fixed;inset:0;z-index:55;pointer-events:none;
  }

  /* ===== 页脚 ===== */
  .footer{
    margin-top:34px;font-size:13px;color:var(--muted);font-weight:300;
    letter-spacing:.04em;
  }
  .footer b{color:#e9d9b0;font-weight:500}

  /* ===== 入场 ===== */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1)}
  .reveal.in{opacity:1;transform:none}
  .d1{transition-delay:.1s}.d2{transition-delay:.28s}.d3{transition-delay:.46s}.d4{transition-delay:.64s}.d5{transition-delay:.82s}

  @media (max-width:380px){
    .actions{gap:9px}
    .act{font-size:13.5px;padding:15px 4px 12px}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
    .flame i{animation:none}
  }
</style>
</head>
<body>

<!-- 夜空星星 -->
<div class="stars" id="stars" aria-hidden="true"></div>

<canvas id="fireworks" aria-hidden="true"></canvas>

<main class="page">
  <p class="eyebrow reveal d1">这一天 想对你说</p>
  <h1 class="title reveal d2">生日快乐</h1>
  <p class="for-name reveal d3">给 <b id="name">尹邑连</b></p>

  <div class="stage reveal d3" id="stage">
    <div class="cake-wrap" id="cakeWrap">
      <img src="assets/cake.jpg" alt="深蓝夜空下的梦幻生日蛋糕，金色蜡烛与粉色气球" width="1024" height="1280">
    </div>
    <div class="glow" aria-hidden="true"></div>
    <div class="flame" aria-hidden="true"><i></i></div>
  </div>

  <p class="wish reveal d4">
    又长大一岁啦。愿你的每一个愿望都能被温柔接住，<br>
    愿星光和好运，都<em>偏向你一点</em>。<br>
    今天要开心，这一整年都要。
  </p>

  <div class="actions reveal d5">
    <button class="act" id="btnCandle" type="button" aria-label="点亮烛光，播放生日歌">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.2c1.6 2 3.4 3.4 3.4 5.4a3.4 3.4 0 1 1-6.8 0C8.6 6.6 10.4 5.2 12 3.2Z"/>
        <path d="M8.5 13.5h7M9 17.5h6M9.5 21.5h5"/>
      </svg>
      <span>点亮烛光</span>
    </button>
    <button class="act" id="btnGift" type="button" aria-label="拆开礼物">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/>
        <path d="M12 9v11.5M2.5 5.5h19v3.5h-19z"/>
        <path d="M12 5.5S9.5 2 7.4 2.6C5.7 3.1 6.4 5.5 12 5.5ZM12 5.5s2.5-3.5 4.6-2.9c1.7.5 1 2.9-4.6 2.9Z"/>
      </svg>
      <span>拆开礼物</span>
    </button>
    <button class="act" id="btnFire" type="button" aria-label="放一场烟花">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="2.2"/>
        <path d="M11 3.5v2.6M11 15.9v2.6M3.5 11h2.6M15.9 11h2.6M5.9 5.9l1.8 1.8M14.3 14.3l1.8 1.8M16.1 5.9l-1.8 1.8M7.7 14.3l-1.8 1.8"/>
        <path d="M19 17.5c.9.4 1.4 1.2 1.4 2.1 0 1-.8 1.7-2.2 2.3-1.3.6-3 .9-4.7.9-1.5 0-2.9-.2-4-.6"/>
      </svg>
      <span>放一场烟花</span>
    </button>
  </div>

  <p class="footer reveal d5">—— 来自永远祝福你的<b>朋友</b></p>
</main>

<!-- 礼物模态 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="giftTitle">
  <div class="gift-card">
    <div class="ribbon">给你的信</div>
    <h3 id="giftTitle">一份小礼物</h3>
    <p id="giftText"></p>
    <button class="close" id="giftClose" type="button">收下祝福</button>
  </div>
</div>

<!-- 音乐开关 -->
<button class="mute" id="muteBtn" type="button" role="switch" aria-checked="true" aria-label="音乐开关">
  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4Z"/>
    <path d="M16 9.2a4.2 4.2 0 0 1 0 5.6M18.8 6.8a7.4 7.4 0 0 1 0 10.4"/>
  </svg>
  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4Z"/>
    <path d="M16.5 9.5l4.5 5M21 9.5l-4.5 5"/>
  </svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ===== 可配置：把名字换成你朋友的名字 ===== */
  var FRIEND_NAME = "尹邑连";

  /* ===== 基础 ===== */
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stage = document.getElementById("stage");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  /* ===== 星星 ===== */
  (function(){
    var wrap = document.getElementById("stars");
    var frag = document.createDocumentFragment();
    for(var i = 0; i < 44; i++){
      var s = document.createElement("span");
      s.className = "star";
      var size = 1 + Math.random() * 2.4;
      s.style.width = s.style.height = size.toFixed(1) + "px";
      s.style.left = (Math.random() * 100).toFixed(2) + "%";
      s.style.top = (Math.random() * 100).toFixed(2) + "%";
      s.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
      s.style.animationDuration = (2.6 + Math.random() * 3).toFixed(2) + "s";
      if (Math.random() < 0.3) s.style.background = "var(--gold-soft)";
      frag.appendChild(s);
    }
    wrap.appendChild(frag);
  })();

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
  }

  /* ===== 入场 ===== */
  window.addEventListener("load", function(){
    var els = document.querySelectorAll(".reveal");
    Array.prototype.forEach.call(els, function(el, idx){
      setTimeout(function(){ el.classList.add("in"); }, idx * 140);
    });
  });

  /* ===== 生日歌（Web Audio 合成）===== */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, musicOn = false, musicTimer = null, scheduleTimer = null;
  // 《祝你生日快乐》C 大调，G4 起
  var NOTES = [
    392.00,392.00,440.00,392.00,523.25,493.88,
    392.00,392.00,440.00,392.00,587.33,523.25,
    392.00,392.00,783.99,659.26,523.25,493.88,440.00,
    349.23,349.23,329.63,523.25,587.33,523.25
  ];
  var STEP = 0.42;            // 每拍秒数
  var NOTE_LEN = 0.34;

  function playNote(t, freq){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
    gain.gain.setValueAtTime(0.28, t + NOTE_LEN - 0.05);
    gain.gain.linearRampToValueAtTime(0.0001, t + NOTE_LEN);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + NOTE_LEN + 0.02);
  }

  function scheduleOneRound(){
    if (!ctx || !musicOn) return;
    var t0 = ctx.currentTime + 0.06;
    NOTES.forEach(function(f, i){ playNote(t0 + i * STEP, f); });
    var total = NOTES.length * STEP + 0.3;
    scheduleTimer = setTimeout(scheduleOneRound, total * 1000);
  }

  function startMusic(){
    if (!AC){ toast("此设备不支持播放音乐"); return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended"){ ctx.resume(); }
    musicOn = true;
    var muteBtn = document.getElementById("muteBtn");
    muteBtn.classList.remove("off");
    muteBtn.setAttribute("aria-checked", "true");
    muteBtn.classList.add("show");
    clearTimeout(scheduleTimer);
    scheduleOneRound();
  }

  function stopMusic(){
    musicOn = false;
    clearTimeout(scheduleTimer);
    if (ctx){
      ctx.suspend().catch(function(){});
    }
  }

  document.getElementById("muteBtn").addEventListener("click", function(){
    var btn = this;
    if (musicOn){
      stopMusic();
      btn.classList.add("off");
      btn.setAttribute("aria-checked", "false");
    } else {
      startMusic();
      btn.classList.remove("off");
      btn.setAttribute("aria-checked", "true");
    }
  });

  /* ===== 点亮烛光 ===== */
  var candleOnce = false;
  document.getElementById("btnCandle").addEventListener("click", function(){
    stage.classList.add("lit");
    document.getElementById("stars").classList.add("lit");
    if (!candleOnce){
      candleOnce = true;
      startMusic();
      toast("烛光亮起，许个愿吧");
    } else {
      toast("愿你的心愿，都悄悄实现");
    }
  });

  /* ===== 拆开礼物 ===== */
  var GIFTS = [
    "这份小小的祝福没有保质期：愿你岁岁常欢愉，年年皆胜意；想做的事都能做成，想去的地方都到得了。",
    "愿你被这个世界温柔以待，也愿你眼里有光、心中有暖，每个普通的日子都闪闪发亮。",
    "新的一岁，继续做喜欢的事，见想见的人。无论走多远，都有一盏灯为你亮着。"
  ];
  var giftIdx = 0;
  var modal = document.getElementById("modal");

  document.getElementById("btnGift").addEventListener("click", function(){
    document.getElementById("giftText").textContent = GIFTS[giftIdx % GIFTS.length];
    giftIdx++;
    modal.classList.add("show");
  });

  function closeGift(){ modal.classList.remove("show"); }
  document.getElementById("giftClose").addEventListener("click", closeGift);
  modal.addEventListener("click", function(e){
    if (e.target === modal) closeGift();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && modal.classList.contains("show")) closeGift();
  });

  /* ===== 烟花（Canvas 粒子）===== */
  var cv = document.getElementById("fireworks");
  var g = cv.getContext("2d");
  var parts = [], rockets = [];
  var fireworksOn = false, pendingLaunches = 0;

  function sizeCanvas(){
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }
  sizeCanvas();
  window.addEventListener("resize", sizeCanvas);

  var PALETTE = ["#f6c869", "#ffd98f", "#ff9db8", "#fff6dd", "#ffb1c4"];

  function explode(x, y){
    var n = 54 + Math.floor(Math.random() * 26);
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 1.2 + Math.random() * 3.6;
      parts.push({
        x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:1, decay:0.008 + Math.random()*0.012,
        size:1.4 + Math.random()*2.2,
        color: PALETTE[Math.floor(Math.random()*PALETTE.length)]
      });
    }
  }

  function launchFirework(){
    pendingLaunches--;
    var x = cv.width * (0.18 + Math.random()*0.64);
    var y = cv.height * (0.18 + Math.random()*0.3);
    rockets.push({ x:x, y:cv.height + 10, tx:x, ty:y, speed:7.5 + Math.random()*2 });
  }

  function tick(){
    g.clearRect(0, 0, cv.width, cv.height);
    var i;
    for (i = rockets.length - 1; i >= 0; i--){
      var r = rockets[i];
      r.y -= r.speed;
      r.x += (r.tx - r.x) * 0.04;
      g.beginPath();
      g.arc(r.x, r.y, 2.2, 0, Math.PI*2);
      g.fillStyle = "#ffd98f";
      g.fill();
      if (r.y <= r.ty){
        explode(r.tx, r.ty);
        rockets.splice(i, 1);
      }
    }
    for (i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.045; p.life -= p.decay;
      if (p.life <= 0){ parts.splice(i, 1); continue; }
      g.globalAlpha = Math.max(p.life, 0);
      g.beginPath();
      g.arc(p.x, p.y, p.size, 0, Math.PI*2);
      g.fillStyle = p.color;
      g.fill();
    }
    g.globalAlpha = 1;
    if (fireworksOn && (pendingLaunches > 0 || parts.length || rockets.length)) requestAnimationFrame(tick);
    else if (fireworksOn){ fireworksOn = false; g.clearRect(0,0,cv.width,cv.height); }
  }

  document.getElementById("btnFire").addEventListener("click", function(){
    if (reduceMotion){
      toast("星光已经为你亮起");
      return;
    }
    if (!fireworksOn){
      fireworksOn = true;
      requestAnimationFrame(tick);
    }
    var count = 4 + Math.floor(Math.random() * 3);
    pendingLaunches = count;
    for (var i = 0; i < count; i++){
      setTimeout(launchFirework, i * 260);
    }
    toast("烟花为你绽放");
  });
})();
</script>
</body>
</html>
